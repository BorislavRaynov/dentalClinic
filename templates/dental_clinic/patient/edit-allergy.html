{% extends 'base.html' %}
{% block page_content %}

    <section id="edit-page" class="content auth">
        <form id="edit" method="post" action="{% url 'allergy-edit' object.pk %}">
            <div class="container">
                <h1>Edit Allergy</h1>

                {% csrf_token %}
                {{ form }}

                <input class="btn submit" type="submit" value="Save">
            </div>
        </form>
    </section>
{% endblock %}
